name: Build Desklet Windows app

on:
  push:
    branches: [main]
    paths:
      - 'DeskletWindows/**'
      - '.github/workflows/desklet-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows app
        run: dotnet publish DeskletWindows/Desklet.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" DeskletWindows\installer.iss'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Desklet-Windows-Installer
          path: installer-output/Desklet-Setup.exe
          if-no-files-found: error
          retention-days: 30